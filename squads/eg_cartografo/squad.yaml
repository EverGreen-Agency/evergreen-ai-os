name: "Cartógrafo EG"
icon: "🗺️"
version: "1.0"
description: "Varre o repo e PROPÕE atualizações para o arquitetura.md — o inventário vivo da EG. Lê a estrutura real de pastas, os squad.yaml, o stack.json e o git log, detecta divergências entre o doc e a realidade, e entrega um diff para aprovação humana. Nunca reescreve o doc sozinho (Write/Read barrier)."

pipeline:
  - id: step_scan
    agent: cartografo
    description: "Varre o repo: lista squads (squad.yaml), lê stack.json, roda git log --oneline -20, lê o arquitetura.md atual. Detecta divergências: squads não documentados, techs ausentes do radar, seções defasadas. Gera rascunho de diff."
    interactive: false

  - id: step_revisao
    agent: cartografo
    description: "Apresenta o diff proposto ao humano com evidências (o que mudou no repo que justifica cada mudança no doc). Aguarda aprovação. Só escreve o que for aprovado."
    interactive: true

  - id: step_aplicacao
    agent: cartografo
    description: "Aplica as seções aprovadas no arquitetura.md. Atualiza a data no cabeçalho. Registra o changelog no _memory/memories.md do squad."
    interactive: false
