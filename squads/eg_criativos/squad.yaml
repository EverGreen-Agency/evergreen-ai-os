name: "Criativos de Anúncio (eg_criativos)"
icon: "🎬"
version: "1.1"
description: "Squad de criativos de anúncio pago: do briefing estratégico ao roteiro (hook/corpo/CTA + shot list + variações A/B), revisão contra as políticas da plataforma e a voz da EverGreen, e análise de performance para a próxima iteração — o loop criar→medir→melhorar. PLATAFORMA e FORMATO são PARÂMETROS (squad por função, não por plataforma — princípio da casa). Config atual: Meta (Instagram/Facebook), vídeo vertical; Google/TikTok e outros formatos entram como configuração, não como squad novo. Cliente é configuração: o Estrategista resolve o client_id e puxa clients/<id>/ antes de pedir briefing."

pipeline:
  - id: step_briefing
    agent: estrategista_anuncios
    description: "Resolve o cliente primeiro (carrega clients/<id>/; se não existir, oferece rodar avulso ou cadastrar via eg_setup), colhe só o briefing que falta e define 2-4 ângulos a testar. Confirma com o usuário antes de seguir."
    interactive: true

  - id: step_roteiros
    agent: roteirista_video
    description: "Com os ângulos aprovados, escreve os roteiros (hook de 3s, corpo, CTA), com shot list e 2-3 variações para teste A/B, no formato configurado (padrão: vídeo vertical Meta). Apresenta ao usuário para aprovação."
    interactive: true

  - id: step_revisao
    agent: revisor_anuncios
    description: "Revisa os roteiros contra as políticas da plataforma (config atual: Meta) e as regras de marca da EverGreen. Marca cada peça como APROVADA ou com ajustes obrigatórios."
    interactive: false

  - id: step_analise
    agent: analista_performance
    description: "Fase de análise (após veicular): recebe as métricas da campanha, diagnostica o gargalo (criativo, oferta ou saturação) e recomenda a próxima iteração de criativo."
    interactive: true
