name: "Meta — Auto-melhoria dos Squads"
version: "1.0"
description: "Fecha o loop de aprendizado: lê o que um squad acumulou em memories.md (e o histórico de runs) e PROPÕE refinos nos .agent.md daquele squad — apresentando um diff para aprovação humana. Nunca reescreve prompt sozinho (Write/Read barrier). É o squad que melhora os outros squads."

pipeline:
  - id: step_diagnostico
    agent: otimizador
    description: "Recebe o nome de um squad-alvo. Carrega o memories.md dele, os .agent.md dos agentes e (se houver) runs.md/state.json. Identifica aprendizados, padrões de erro e instruções que ficaram desatualizadas — e propõe edições concretas (diff) em cada .agent.md, com a justificativa ligada a uma evidência da memória. Apresenta tudo ao usuário."
    interactive: true

  - id: step_aplicacao
    agent: otimizador
    description: "Aplica APENAS as edições aprovadas pelo usuário nos .agent.md do squad-alvo. Registra no memories.md do alvo uma linha de changelog (o que mudou e por quê). Confirma o que foi gravado."
    interactive: false
