name: "Engenharia EG (SDD + ADR)"
icon: "⚙️"
version: "1.0"
description: "Squad de desenvolvimento via Spec-Driven Development, para projetos de CLIENTE ou INTERNOS da EG (dogfooding). Recebe um brief de cliente OU uma ideia madura do Banco de Ideias em stage `project` (interno), produz uma spec.md (o contrato), registra as decisões de stack como ADRs (consultando o Banco de Stack), e gera o scaffold do repo + árvore de tarefas. Cada decisão técnica tem um porquê escrito. O alvo (`target`: client/internal) é CONFIGURAÇÃO: muda só de onde vem o brief e onde moram os artefatos — NUNCA o grau de autonomia. Os gates de aprovação (spec, ADRs) são HITL para os dois. Artefatos: cliente em _opensquad/_memory/clients/<id>/engenharia/; interno em _opensquad/_memory/engenharia/<id>/."

pipeline:
  - id: step_spec
    agent: especificador
    description: "Recebe o brief — de cliente, ou a ideia interna do Banco (docs/<id>.md, stage `project`). Faz as perguntas que faltam (uma onda, não um muro) e produz a spec.md: objetivo, escopo, requisitos funcionais e não-funcionais, critérios de aceite e o que está FORA de escopo. A spec é o contrato — apresenta ao usuário para aprovação antes de prosseguir."
    interactive: true

  - id: step_decisoes
    agent: decisor_tecnico
    description: "A partir da spec aprovada, decide a stack consultando o Banco de Stack (só Adopt/Trial sem bandeira; Assess é experimento explícito). Para cada escolha relevante (linguagem, framework, arquitetura, padrão de dados) escreve um ADR: contexto → opções → escolha → consequência. Se promover uma tech Trial→Adopt, atualiza o stack.json. Apresenta os ADRs para aprovação."
    interactive: true

  - id: step_scaffold
    agent: scaffolder
    description: "Com spec + ADRs aprovados, gera o esqueleto do repositório do projeto (estrutura de pastas, arquivos base, README) e a árvore de tarefas quebrada por componente/feature, pronta para virar tarefas no ClickUp (Kickoff Técnico). Cada task referencia a seção da spec que a originou."
    interactive: false
