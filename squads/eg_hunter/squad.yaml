name: "Outbound Hunter (Propostas)"
version: "1.0"
description: "Squad focado em analisar vagas de plataformas de freelancers (Upwork, Freelancermap) e gerar propostas comerciais altamente conversivas baseadas no framework da EverGreen MKT."

pipeline:
  - id: step_scout
    agent: scout
    description: "Extrai dores e necessidades do projeto a partir do texto bruto da vaga."
    execution: inline

  - id: step_closer
    agent: closer
    description: "Gera a proposta comercial final adaptada para Dev ou Growth, seguindo o padrão EG."
    execution: inline
