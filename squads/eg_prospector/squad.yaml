name: "Prospector EG"
icon: "🎯"
version: "1.0"
description: "O caçador de verdade: a partir do ICP da EverGreen, gera LISTAS de leads B2B qualificados usando fontes de dados reais (MCPs Apollo/Lusha/Clay/Vibe Prospecting), enriquece, faz score de fit vs. ICP e entrega lista pronta para o outbound (Kommo) ou para o eg_proposals. Topo de funil. Não confundir com eg_proposals (que converte UMA oportunidade em proposta)."

pipeline:
  - id: step_icp
    agent: icp_definer
    description: "Confirma/refina os critérios de busca a partir do ICP da EG (integradoras solar > R$150k/mês, B2B maduro, dono presente). Traduz em filtros concretos: setor, porte, cargo dos decisores, geografia. Apresenta os filtros ao usuário para aprovação antes de gastar créditos de API."
    interactive: true

  - id: step_hunt
    agent: hunter
    description: "Com os filtros aprovados, busca e enriquece leads via os MCPs disponíveis (Apollo/Lusha/Clay/Vibe). Dedup, valida dados de contato, monta a lista bruta. Reporta consumo de créditos."
    interactive: false

  - id: step_score
    agent: qualifier
    description: "Pontua cada lead por fit vs. ICP (sinais de maturidade, intenção, porte). Ordena, corta os fora-de-perfil, e entrega a lista final qualificada — pronta para virar pipeline no Kommo (sob aprovação) ou alimentar o eg_proposals. NÃO escreve no CRM sozinho (Write/Read barrier)."
    interactive: true
