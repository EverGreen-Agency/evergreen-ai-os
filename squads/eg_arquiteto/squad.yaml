name: "Arquiteto EG"
icon: "🛡️"
version: "1.0"
description: "Avaliação de ideia/projeto INTERNO (nunca de cliente) em DUAS lentes: NEGÓCIO (Avaliador — deveria existir? é 10x? monetiza?) roda primeiro, depois ESTRUTURA (Guardião/Arquiteto — cabe? reaproveita/integra/assina/constrói?). O Guardião audita LENDO O REPO AO VIVO — escaneia squads/, stack.json, .mcp.json e o código real (não um inventário congelado). Roda 5 gates: squad / integração / stack / princípios / alavancagem (build vs buy vs reuse). Saída é parecer consultivo — nunca reescreve nada sozinho (Write/Read barrier). O arquitetura.md guarda só o 'porquê'; o 'o quê' ele lê do código."

pipeline:
  - id: step_negocio
    agent: avaliador_negocios
    description: "Avalia o MÉRITO de negócio do item interno (deveria existir?) por duas lentes — primeiros princípios (Musk) e oferta/valor (Hormozi). Veredito CONSTRUIR/CORTAR/SIMPLIFICAR/ADIAR + a ONE THING. Corta enfeite ANTES da auditoria técnica."
    interactive: true

  - id: step_auditoria
    agent: arquiteto
    description: "Recebe o item a auditar (ideia/projeto interno). Escaneia o repo ao vivo: lista squads/ e lê os squad.yaml, lê stack.json, .mcp.json e o que mais for relevante (Glob/Grep/Read). Lê os princípios no arquitetura.md. Roda os 4 gates (squad / integração / stack / princípios) e emite um parecer estruturado com veredito e recomendação. Pede ao usuário o que fazer com o parecer."
    interactive: true

  - id: step_registro
    agent: arquiteto
    description: "Com aprovação do usuário, aplica a consequência do parecer: registra/atualiza ideia no Banco de Ideias, e/ou propõe registrar uma DECISÃO arquitetural nova no arquitetura.md (o porquê, não inventário). Só escreve com aprovação explícita. Confirma o que foi gravado."
    interactive: false
