# Nome global no Fly.io. Altere antes do primeiro deploy caso já esteja ocupado.
app = "bioma-eg-api-staging"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "python scripts/migrate.py"
  strategy = "canary"
  release_command_timeout = "10m"

[env]
  APP_ENV = "staging"
  API_NAME = "Bioma API - Staging"
  SESSION_COOKIE_NAME = "bioma_staging_session"
  SESSION_TTL_HOURS = "12"
  SESSION_COOKIE_SECURE = "true"
  SESSION_COOKIE_SAMESITE = "lax"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 150

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health/ready"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
