name: Bioma Web Deploy

on:
  push:
    branches: [develop, main]
    paths:
      - "bioma/apps/web/**"
      - ".github/workflows/bioma-web-deploy.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Ambiente de deploy"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

concurrency:
  group: bioma-web-deploy-${{ github.ref }}-${{ github.event.inputs.target || 'auto' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bioma/apps/web
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_STAGING_ALIAS: ${{ secrets.VERCEL_STAGING_ALIAS }}
      DEFAULT_VERCEL_STAGING_ALIAS: staging.bioma.evergreenmkt.com.br
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bioma/apps/web/package-lock.json

      - name: Resolve target
        id: target
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            REQUESTED_TARGET="${{ github.event.inputs.target }}"
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            REQUESTED_TARGET="production"
          else
            REQUESTED_TARGET="staging"
          fi

          if [[ "$REQUESTED_TARGET" == "production" ]]; then
            echo "vercel_environment=production" >> "$GITHUB_OUTPUT"
            echo "deploy_flags=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "vercel_environment=preview" >> "$GITHUB_OUTPUT"
            echo "deploy_flags=" >> "$GITHUB_OUTPUT"
          fi

          echo "target=$REQUESTED_TARGET" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_APP_ENV: ${{ steps.target.outputs.target }}
          VITE_API_BASE_URL: ${{ steps.target.outputs.target == 'production' && secrets.BIOMA_PRODUCTION_API_BASE_URL || secrets.BIOMA_STAGING_API_BASE_URL || 'https://api-staging.bioma.evergreenmkt.com.br' }}
        run: npm run build

      - name: Debug build output
        run: |
          pwd
          test -f dist/index.html
          du -sh dist
          ls -la dist

      - name: Prepare Vercel output
        shell: bash
        # `vercel deploy --prebuilt` always reads .vercel/output from the
        # directory where the CLI is invoked. The CLI runs from the monorepo
        # root because the remote project already defines bioma/apps/web as
        # its Root Directory.
        working-directory: ${{ github.workspace }}
        run: |
          rm -rf .vercel/output
          mkdir -p .vercel/output/static
          cp -R bioma/apps/web/dist/. .vercel/output/static/
          cat > .vercel/output/config.json <<'JSON'
          {
            "version": 3,
            "routes": [
              { "handle": "filesystem" },
              { "src": "/(.*)", "dest": "/index.html" }
            ]
          }
          JSON
          test -f .vercel/output/static/index.html
          test -f .vercel/output/config.json

      - name: Deploy
        id: deploy
        shell: bash
        # The Vercel project already has Root Directory=bioma/apps/web.
        # Run the CLI from the monorepo root so that directory is applied once.
        working-directory: ${{ github.workspace }}
        run: |
          test -f .vercel/output/static/index.html
          test -f .vercel/output/config.json
          DEPLOYMENT_URL="$(npx vercel@latest deploy --prebuilt ${{ steps.target.outputs.deploy_flags }} --yes --token="$VERCEL_TOKEN" | tail -n 1)"
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Deployment URL: $DEPLOYMENT_URL"

      - name: Alias staging
        if: ${{ steps.target.outputs.target == 'staging' }}
        shell: bash
        run: |
          ALIAS_DOMAIN="${VERCEL_STAGING_ALIAS:-$DEFAULT_VERCEL_STAGING_ALIAS}"
          npx vercel@latest alias set "${{ steps.deploy.outputs.url }}" "$ALIAS_DOMAIN" --token="$VERCEL_TOKEN"

      - name: Summary
        shell: bash
        run: |
          {
            echo "### Bioma Web Deploy"
            echo ""
            echo "- Target: ${{ steps.target.outputs.target }}"
            echo "- URL: ${{ steps.deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
