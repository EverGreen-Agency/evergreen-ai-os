name: Bioma CI

on:
  push:
    branches: [develop, main]
    paths:
      - "bioma/**"
      - ".github/workflows/bioma-ci.yml"
  pull_request:
    paths:
      - "bioma/**"
      - ".github/workflows/bioma-ci.yml"

concurrency:
  group: bioma-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bioma/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bioma/apps/web/package-lock.json
      - run: npm ci
      - run: npm run build

  api-worker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bioma
          POSTGRES_USER: bioma
          POSTGRES_PASSWORD: bioma
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bioma -d bioma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: local
      DATABASE_URL: postgresql://bioma:bioma@localhost:5432/bioma
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            bioma/apps/api/requirements.txt
            bioma/apps/worker/requirements.txt
      - run: pip install -r bioma/apps/api/requirements.txt -r bioma/apps/worker/requirements.txt
      - run: python -m compileall bioma/apps/api/bioma_api bioma/apps/api/scripts bioma/apps/worker/bioma_worker bioma/apps/worker/scripts
      - run: python bioma/apps/api/scripts/migrate.py
      - run: python bioma/apps/api/scripts/seed_dev.py
      - run: python bioma/apps/api/scripts/smoke_api.py
      - run: python bioma/apps/api/scripts/smoke_clickup.py
      - run: python bioma/apps/api/scripts/smoke_performance.py
      - run: python bioma/apps/worker/scripts/smoke_worker.py
      - run: python bioma/apps/worker/scripts/smoke_queue.py
